# Noise-robustness sweep — noisy sine benchmark (reviewer: "no noise in signal")
# Same estimator settings as the paper's main MMTT-Bench run, swept across
# observation-noise levels sigma ∈ {0 (clean), 0.05, 0.1, 0.2, 0.4}.
# Datasets generated by:
#   python src/mmtt_bench/data_generation/sine_generator.py \
#     --signal-type noisy_sine_with_constants --noise-std <sigma> \
#     --output-dir datasets/benchmark_splits_noise<sigma>
# Annotations describe the clean underlying pattern; noise lives in the
# observed signal (lookbacks and forecast targets).

data_path:      datasets/benchmark_splits/train.json
embedding_type: sentence_transformer
model_name:     sentence-transformers/all-distilroberta-v1
ts_tokenizer:   identity
horizon_steps:  1
lookback_steps: 2
patch_len:      1
stride:         1

compute_kwargs:
  pca_dim:      16
  n_bootstrap:  20
  strategy: discrete

metrics:
  mutual_information:
    n_neighbours: 1
    n_subsample_reps:  20
  cca:
    n_bootstrap: 20
    eps: 1e-5
  v_information:
    cv: 5
    n_bootstrap:  20
  pid:
    n_clusters_ts:   4
    n_clusters_text: 5
    n_bins_y:        4
    n_bootstrap:  20
  mine:
    mine_iters: 500
    n_bootstrap: 20
    lr: 0.0001
  infonce:
    n_bootstrap: 20
    hidden_dim:  128
    n_iters:     500
    batch_size:  64
    lr:          0.001
  # cca:
  #   n_bootstrap: 20
  #   eps: 1e-5
  # v_information:
  #   cv: 5
  #   n_bootstrap:  20
  # pid:
  #   n_clusters_ts:   4
  #   n_clusters_text: 5
  #   n_bins_y:        4
  #   n_bootstrap:  20

sweep:
  param: data_path
  values:
    # - datasets/benchmark_splits/train.json
    - datasets/benchmark_splits_noise0.05/train.json
    - datasets/benchmark_splits_noise0.1/train.json
    - datasets/benchmark_splits_noise0.2/train.json
    - datasets/benchmark_splits_noise0.4/train.json
