    categories: ['correct', 'incorrect', 'irrelevant']

  - name:       DIS
    train_json: datasets/fintexts_splits/fintexts_1/DIS/train.json
    val_json:   datasets/fintexts_splits/fintexts_1/DIS/val.json
    freq:       fintexts
    categories: ['correct', 'incorrect', 'irrelevant']

  - name:       GOOGL
