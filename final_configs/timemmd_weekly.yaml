# Time-MMD, WEEKLY domains (CFA freq settings: seq_len 36, pred_len 12).
# Economy and Security are excluded: fewer than 300 training samples per
# category and no usable validation split. Monthly domains: timemmd.yaml.

# timemmd_cfa_mi.yaml
# MI metrics config for run.py using the timemmd_cfa annotation-point splits
# (correct / incorrect / irrelevant).
#
# Generate splits first (if not already done):
#   python src/mmtt_bench/data_generation/timemmd_cfa.py \
#       --output-dir datasets/timemmd_cfa_splits
#
# Run:
#   python run.py timemmd_cfa_mi.yaml --output results/timemmd_cfa_mi/
#
# Note: run.py applies one lookback_steps/horizon_steps to all datasets in a
# datasets: list, so weekly and monthly datasets must be run separately.
# Active settings below are for weekly; swap in the monthly block to run those.
#
# lookback_steps and horizon_steps match CFA's FREQ_SETTINGS:
#   weekly:  seq_len=36  → lookback_steps=36,  min pred_len=12 → horizon_steps=12
#   monthly: seq_len=8   → lookback_steps=8,   min pred_len=6  → horizon_steps=6

# ── TS tokenizer ──────────────────────────────────────────────────────────────
ts_tokenizer:   patch_mean


# ── Text encoder ──────────────────────────────────────────────────────────────
embedding_type: sentence_transformer
model_name:     sentence-transformers/all-distilroberta-v1

# ── Metric settings ───────────────────────────────────────────────────────────
compute_kwargs:
  pca_dim:     5
  n_bootstrap: 20
  strategy:    quantile

metrics:
  mutual_information:
    n_neighbours: 1
    n_subsample_reps:  20
  # mine:
  #    mine_iters: 500
  #    n_bootstrap: 5
  #    mine_batch_size: 256
  #    lr: 0.0001
  # infonce:
  #    n_bootstrap: 20   # point estimate — training is slow
  #    hidden_dim:  128
  #    n_iters:     500
  #    batch_size:  256     # ceiling on MI = log(64) ≈ 4.2 nats
  #    lr:          0.001
  # cca:
  #   n_bootstrap: 20    # same as KSG for fair variance comparison
  #   eps: 1e-5   
  # v_information:
  #   cv: 5
  #   n_bootstrap:  20
  # pid:
  #   n_clusters_ts:   4
  #   n_clusters_text: 16
  #   n_bins_y:        4
  #   n_bootstrap:  20

# ── Weekly datasets ───────────────────────────────────────────────────────────
# datasets:
#   - datasets/timemmd_cfa_splits/Energy/train.json
  # - datasets/timemmd_cfa_splits/PublicHealth/train.json


# data_path: datasets/timemmd_cfa_splits/PublicHealth/train.json

# patch_len:      4      # weekly: 17 patches over 36 steps  (monthly: 3 patches over 8 steps with patch_len=2, stride=1)
# stride:         2

# #── Weekly window settings (Energy, PublicHealth) ─────────────────────────────
# lookback_steps: 36
# horizon_steps:  12


# ── Monthly datasets ──────────────────────────────────────────────────────────
# Swap these in and update lookback_steps/horizon_steps/patch_len/stride above:

lookback_steps: 36
horizon_steps: 12
patch_len: 4
stride: 2

datasets:
  - datasets/timemmd_cfa_splits/Energy/train.json
  - datasets/timemmd_cfa_splits/PublicHealth/train.json

