# timemmd_cfa.yaml
# Settings to reproduce CFA (Lee et al. 2026, arXiv:2603.22372) on TimeMMD data.
#
# Text encoder
# ─────────────
# CFA uses the LLM's input embedding lookup (no full forward pass):
#   token_ids → get_input_embeddings() → [B, L, d_llm]
#   → MLP(d_llm → d_llm/8 → pred_len) → avg-pool → [B, pred_len]
#
# Invariant from CFA run.py line 174: text_emb = pred_len
# (the MLP output dimension is always the forecast horizon length)

# ── Data format ───────────────────────────────────────────────────────────────
# mmtt  : annotation-point JSONs from timemmd_cfa.py (train_json / val_json below)
# mmtsf : MM-TSFlib CSV sliding windows via Dataset_Custom (root_path / data_path)
data_format: mmtt

# ── Text encoder ──────────────────────────────────────────────────────────────
llm_model:     BERT      # BERT (d_llm=768) | GPT2 (768) | LLAMA3 (4096)
llm_layers:    6          # number of LLM layers to load
text_len:      4          # only used when data_format: mmtsf (Final_Search_4)
pool_type:     avg        # avg | max | min  — pooling over token dimension
use_fullmodel: false      # false = embedding lookup only (CFA default)

# ── CFA adapter ───────────────────────────────────────────────────────────────
cfa_reduction: 8          # bottleneck ratio: bottleneck = d_model // cfa_reduction
                          # → 512 // 8 = 64 (matches paper)

# ── TS backbone hyperparameters (CFA paper Table E.1) ─────────────────────────
d_model:  512
n_heads:  8
e_layers: 2
d_layers: 1
d_ff:     2048
dropout:  0.1

# ── Training ──────────────────────────────────────────────────────────────────
train_epochs:   10
patience:       5
batch_size:     32
learning_rate:  0.0001    # TS model (η_TS = 1e-4)
lr_mlp:         0.01      # text MLP (η_MLP = 1e-2)
# lr_multiplier is tuned over [0.05, 0.1, 0.5, 1.0, 2.0, 5.0, 10.0, 20.0, 50.0, 100.0]
# Set via --lr-multiplier CLI flag; default 1.0 matches the paper's η_TS=1e-4.
# For attention-heavy models (Transformer, Informer, Reformer, Crossformer),
# smaller multipliers (0.05–0.1) typically work better.
lr_multiplier:  1.0
# Per-model overrides can be passed via --lr-multiplier when running individually.

# ── Injection modes (from run_timemmd.sh) ─────────────────────────────────────
injection_modes:
  - unimodal          # ts-only baseline
  - last-additive     # naive: text added after decoder (equivalent to add_projected)
  - first-additive    # naive: text added at embedding layer input
  - middle-additive   # naive: text added at encoder norm layer
  - first-concat      # naive: text concatenated at input embedding
  - middle-concat     # naive: text concatenated at encoder norm
  - last-concat       # naive: text concatenated after decoder
  - film              # constrained: feature-wise linear modulation
  - cfa               # constrained: low-rank bottleneck adapter (best in paper)
  - gating            # constrained: data-dependent sigmoid gate
  - orthogonal        # constrained: orthogonal text component only

# ── TS backbone models (from run_timemmd.sh) ──────────────────────────────────
models:
  - PatchTST
  - DLinear
  - iTransformer
  - Autoformer
  - FEDformer
  - Informer
  - Transformer
  - Reformer
  - Crossformer
  - TSMixer
  - TiDE
  - Nonstationary_Transformer
  - FiLM
  # Koopa excluded: calls data_provider() during __init__ to compute frequency
  # masks, which requires the full CFA data-loading stack (configs.data, root_path,
  # data_path etc.) that our SimpleNamespace does not provide.

# ── TimeMMD datasets ──────────────────────────────────────────────────────────
# Splits generated by:
#   python src/mmtt_bench/data_generation/timemmd_cfa.py \
#       --output-dir datasets/timemmd_cfa_splits
#
# categories: ['correct'] trains on the natural text pairing only.
# To switch back to MM-TSFlib CSV sliding windows, set data_format: mmtsf and
# replace train_json/val_json with root_path/data_path (see git history).
datasets:
  - name:       Agriculture
    train_json: /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/Agriculture/train.json
    val_json:   /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/Agriculture/val.json
    freq:       monthly
    categories: ['correct', 'incorrect', 'irrelevant']

  - name:       Climate
    train_json: /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/Climate/train.json
    val_json:   /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/Climate/val.json
    freq:       monthly
    categories: ['correct', 'incorrect', 'irrelevant']

  - name:       Economy
    train_json: /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/Economy/train.json
    val_json:   /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/Economy/val.json
    freq:       monthly
    categories: ['correct', 'incorrect', 'irrelevant']

  - name:       Energy
    train_json: /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/Energy/train.json
    val_json:   /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/Energy/val.json
    freq:       weekly
    categories: ['correct', 'incorrect', 'irrelevant']

  - name:       PublicHealth
    train_json: /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/PublicHealth/train.json
    val_json:   /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/PublicHealth/val.json
    freq:       weekly
    categories: ['correct', 'incorrect', 'irrelevant']

  - name:       Security
    train_json: /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/Security/train.json
    val_json:   /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/Security/val.json
    freq:       monthly
    categories: ['correct', 'incorrect', 'irrelevant']

  - name:       SocialGood
    train_json: /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/SocialGood/train.json
    val_json:   /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/SocialGood/val.json
    freq:       monthly
    categories: ['correct', 'incorrect', 'irrelevant']

  - name:       Traffic
    train_json: /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/Traffic/train.json
    val_json:   /root/emma-code/mmtt-bench/datasets/timemmd_cfa_splits/Traffic/val.json
    freq:       monthly
    categories: ['correct', 'incorrect', 'irrelevant']

# ── Frequency-specific window settings (from run_timemmd.sh get_forecast_settings) ──
freq_settings:
  daily:
    pred_lengths: [48, 96, 192, 336]
    seq_len:  96
    label_len: 48

  weekly:
    pred_lengths: [12, 24, 36, 48]
    seq_len:  36
    label_len: 18

  monthly:
    pred_lengths: [6, 8, 10, 12]
    seq_len:  8
    label_len: 4
